name: Run an neodev cloud agent
description: Run the neodev agent in a GitHub workflow
author: Cognix Team <info@khulnasoft.com>

inputs:
  prompt:
    description: Prompt for the Neodev Agent
    required: false
  saved_prompt:
    description: "Cognix Drive Saved prompt ID for the neodev agent"
    required: false
    default: ""
  skill:
    description:
      "Use a skill as the base prompt for the agent. Format: `skill_name`, `repo:skill_name`, or
      `org/repo:skill_name`"
    required: false
    default: ""
  model:
    description: "Override the base model used by the agent (Cognix model ID)"
    required: false
    default: ""
  name:
    description: "Name for this agent task"
    required: false
    default: ""
  mcp:
    description:
      "MCP configuration in JSON format (or path to a mcp.json file) to start before executing the
      agent"
    required: false
    default: ""
  cwd:
    description: "Current working directory for the neodev agent"
    required: false
    default: ""
  profile:
    description: "Neodev Agent profile for the neodev agent"
    required: false
    default: ""
  output_format:
    description: Format for agent output
    required: true
    default: text
  warp_api_key:
    description: "neodev API key for the neodev agent"
    required: false
    default: ""
  cloud:
    description: "Run the agent as a cloud agent (uses `neodev agent run-cloud` instead of `neodev agent run`)"
    required: false
    default: "false"
  host:
    description: "Host to route the cloud agent run to"
    required: false
    default: ""
  environment:
    description: "Environment ID for the cloud agent run; defaults to no environment when unset"
    required: false
    default: ""
  share:
    description: Recipients to share the agent's session with in neodev.
    required: false
    default: ""
  computer_use:
    description:
      "Enable computer use for cloud agent runs (`neodev agent run-cloud --computer-use`). Ignored
      for local runs."
    required: false
    default: "false"
  neodev_channel:
    description: neodev release channel to use
    required: true
    default: stable
  neodev_version:
    description: Specific neodev version to install
    required: true
    default: latest

runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
  post-if: always()
