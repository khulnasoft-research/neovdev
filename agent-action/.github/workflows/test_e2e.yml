on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run_warp_test:
    name: Test running the Neodev agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Oz
        uses: ./.
        id: oz
        with:
          neodev_channel: preview
          prompt: Say hello
          warp_api_key: ${{ secrets.COGNIX_API_KEY }}

      - name: Verify output
        env:
          AGENT_OUTPUT: ${{ steps.oz.outputs.agent_output }}
        run: |
          if [[ -z "$AGENT_OUTPUT" ]]; then
            echo "Warp produced no output"
            exit 1
          fi

      - name: Run Neodev with skill from repository
        uses: ./.
        id: neodev-skill
        with:
          neodev_channel: preview
          skill: "test-skill"
          warp_api_key: ${{ secrets.COGNIX_API_KEY }}

      - name: Verify skill output
        env:
          SKILL_OUTPUT: ${{ steps.neodev-skill.outputs.agent_output }}
        run: |
          if [[ -z "$SKILL_OUTPUT" ]]; then
            echo "Warp skill produced no output"
            exit 1
          fi
          if [[ "$SKILL_OUTPUT" != *"GitHub Action skill test successful"* ]]; then
            echo "Skill output did not contain expected message"
            echo "Skill output: $SKILL_OUTPUT"
            exit 1
          fi
